<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoBajío - Iniciar Sesión</title>
  <link rel="stylesheet" href="../CSS/estilo.css">
  <style>
    /* Estilos específicos para centrar el login */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--primary);
    }
    .login-box {
      background: var(--white);
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-box h1 {
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-login {
      width: 100%;
      background-color: var(--secondary);
      color: var(--white);
      border: none;
      padding: 1rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <h1>EcoBajío</h1>
      <p style="margin-bottom: 2rem;">Protección de árboles urbanos</p>
      
      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="********">
        </div>
        <!-- En una app real usaríamos un button type="submit", aquí simulamos la navegación con un href -->
        <a href="dashboard.html" class="btn-login">Ingresar al Sistema</a>
      </form>
    </div>
  </div>

</body>
</html>

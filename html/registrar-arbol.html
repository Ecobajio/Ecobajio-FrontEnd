<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EcoBajío - Registrar Árbol</title>
  <link rel="stylesheet" href="../CSS/estilo.css">
</head>
<body class="app-layout">

  
  <div class="navbar">
    <div class="nav-brand">EcoBajío</div>
    <div class="nav-links">
      <a href="dashboard.html">Mapa</a>
      <a href="registrar-arbol.html" class="active">Registrar Árbol</a>
      <a href="alertas.html">Mis Alertas <span class="badge">1</span></a>
      <a href="evidencia.html">Evidencias</a>
    </div>
    <div class="user-menu">
      <a href="index.html" class="btn-logout">Cerrar Sesión</a>
    </div>
  </div>

  
  <div class="form-page">
    <div class="form-container">
      <h2>Registrar Nuevo Árbol</h2>
      
      
      <form action="dashboard.html" method="GET">
        
        <div class="form-group">
          <label>Especie</label>
          <select name="especie">
            <option value="mezquite">Mezquite Nativo</option>
            <option value="palo-dulce">Palo Dulce</option>
            <option value="colorin">Colorín</option>
            <option value="otro">Otra especie...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ubicación (Colonia / Calle)</label>
          <input type="text" name="ubicacion" placeholder="Ej. Zona Centro, calle Madero..." required>
        </div>

        <div class="form-group">
          <label>Estado Inicial</label>
          <select name="estado">
            <option value="sano">Sano (Recién plantado)</option>
            <option value="estres">Con Estrés Hídrico (Necesita agua)</option>
            <option value="plaga">Con Plaga (Requiere revisión)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Guardar Registro</button>
      </form>
    </div>
  </div>

</body>
</html>
